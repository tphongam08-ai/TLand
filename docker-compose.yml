services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: tland
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
    volumes:
      - tland_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d tland"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://user:pass@db:5432/tland
      ALLOWED_ORIGINS: https://tphongam08-ai.github.io,http://localhost:5500,http://127.0.0.1:5500
    ports:
      - "8000:8000"
volumes:
  tland_pgdata:
