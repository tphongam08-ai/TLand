<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Sarabun',sans-serif;background:#0f172a;color:#e2e8f0;overflow:hidden;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
body{display:flex;flex-direction:column;height:100dvh}
#header{background:linear-gradient(135deg,#0f172a,#1c3a5e);padding:8px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 12px rgba(0,0,0,.7);flex-shrink:0;z-index:100;border-bottom:1px solid #fbbf2433}
#header-logo{width:36px;height:36px;border-radius:50%;border:1.5px solid #fbbf24;object-fit:cover;flex-shrink:0}
#header-text h1{font-size:14px;font-weight:700;color:#fbbf24}
#header-text p{font-size:10px;color:#64748b;margin-top:1px}
#badge{margin-left:auto;background:#fbbf24;color:#0f172a;border-radius:20px;padding:2px 10px;font-size:10px;font-weight:700;white-space:nowrap}
#main{display:flex;flex:1;overflow:hidden;position:relative}
#map{flex:1;z-index:1}
#sidebar{width:220px;background:#0f172a;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px;display:flex;flex-direction:column;gap:5px;flex-shrink:0;border-left:1px solid #1e293b;z-index:10}
#sidebar h2{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:1px;margin:4px 0 2px}
.divider{height:1px;background:#1e293b;margin:2px 0}
.bm-row{display:flex;gap:3px;flex-wrap:wrap}
.bm-btn{flex:1;min-width:52px;background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:6px;padding:5px 3px;font-size:10px;font-family:'Sarabun',sans-serif;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.bm-btn.active{background:#fbbf24;color:#0f172a;border-color:#fbbf24;font-weight:700}
.grp-hdr{background:#1e3a5e;border-radius:7px;padding:6px 9px;font-size:11px;font-weight:700;color:#93c5fd;display:flex;align-items:center;justify-content:space-between}
.layer-item{display:flex;align-items:center;gap:7px;padding:6px 8px;background:#1e293b;border-radius:7px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.layer-item.hidden{opacity:.35}
.cdot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.lname{font-size:11px;flex:1;line-height:1.3}
#coord-panel{background:#1e293b;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:6px}
#coord-panel label{font-size:10px;color:#94a3b8}
.cinput{width:100%;background:#0f172a;border:1px solid #334155;color:#e2e8f0;border-radius:5px;padding:6px 7px;font-size:12px;font-family:'Sarabun',sans-serif}
.cinput:focus{outline:none;border-color:#fbbf24}
#goto-btn{background:#fbbf24;color:#0f172a;border:none;border-radius:5px;padding:6px;font-size:11px;font-family:'Sarabun',sans-serif;font-weight:700;cursor:pointer;width:100%}
#cres{font-size:11px;color:#94a3b8;min-height:34px;background:#0f172a;border-radius:5px;padding:6px;line-height:1.5}
#cres.found{color:#4ade80}
#cres.notfound{color:#f87171}
#loc-btn{background:#1e293b;border:1px solid #334155;color:#94a3b8;border-radius:6px;padding:7px;font-size:11px;font-family:'Sarabun',sans-serif;cursor:pointer;width:100%;text-align:center}
#loc-btn.locating{color:#fbbf24;border-color:#fbbf24;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
#cbar{position:absolute;bottom:0;left:0;background:rgba(15,23,42,.88);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#94a3b8;font-size:11px;padding:4px 10px;z-index:500;border-top-right-radius:8px;pointer-events:none;font-family:monospace}
#popup{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.97);border:1px solid #fbbf24;border-radius:12px;padding:10px 16px;min-width:230px;max-width:90vw;z-index:9999;display:none;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 24px rgba(0,0,0,.6)}
#popup h3{color:#fbbf24;font-size:13px;margin-bottom:3px}
#popup p{font-size:11px;color:#94a3b8;margin-top:2px}
#pclose{float:right;cursor:pointer;color:#64748b;font-size:16px;margin-left:8px}
#splash{position:fixed;inset:0;z-index:99999;background:#0f172a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#splash img{width:100px;height:100px;border-radius:50%;border:2px solid #fbbf24;animation:si .6s ease}
#splash h2{color:#fbbf24;font-size:22px;font-weight:700}
#splash p{color:#64748b;font-size:13px}
@keyframes si{from{transform:scale(.5) rotate(-30deg);opacity:0}to{transform:scale(1);opacity:1}}
@media(max-width:600px){
  #main{flex-direction:column}
  #sidebar{width:100%;max-height:44vh;flex-direction:row;flex-wrap:wrap;overflow-x:auto;overflow-y:hidden;border-left:none;border-top:1px solid #1e293b;align-items:flex-start}
  #sidebar>*{flex-shrink:0;min-width:175px}
}

#add-layer-btn{float:right;border:0;background:#2563eb;color:#fff;border-radius:8px;font-size:20px;width:32px;height:32px}#upload-box{display:none;background:#f8fafc;padding:9px;border-radius:10px;margin:7px 0}#upload-box.open{display:block}#upload-box input,#upload-box select{width:100%;box-sizing:border-box;margin:4px 0;padding:8px;border:1px solid #cbd5e1;border-radius:7px}.upload-row{display:flex;gap:6px}.upload-row input[type=color]{width:52px;padding:2px}#upload-btn{width:100%;padding:9px;background:#0f766e;color:white;border:0;border-radius:8px;font-weight:700}#layer-status{font-size:11px;color:#64748b;padding:5px}.layer-item{gap:7px}.layer-actions{display:flex;align-items:center;gap:5px}.layer-color{width:28px;height:24px;border:0;padding:0;background:none}.del-btn{border:0;background:#fee2e2;color:#b91c1c;border-radius:6px;padding:5px 7px}.toast{position:fixed;z-index:99999;left:50%;bottom:28px;transform:translateX(-50%);padding:10px 14px;border-radius:10px;color:#fff;background:#0f172a;box-shadow:0 4px 18px #0004;max-width:80vw}.attr-table{border-collapse:collapse;width:100%;font-size:11px}.attr-table td{padding:3px;border-bottom:1px solid #e2e8f0;vertical-align:top}.attr-table td:first-child{font-weight:700;color:#475569;max-width:110px;word-break:break-word}.attr-table td:last-child{word-break:break-word}#popup{max-height:55vh;overflow:auto}</style>
</head>

const AL={},DATA={},VM={};
function swBM(n,btn){map.removeLayer(BM[cBM]);BM[n].addTo(map);cBM=n;Object.values(AL).forEach(x=>x.leaflet&&x.leaflet.bringToFront());document.querySelectorAll('.bm-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg,ok=true){const d=document.createElement('div');d.className='toast';d.style.background=ok?'#0f766e':'#b91c1c';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function popupProps(name,props,latlng){document.getElementById('ptitle').textContent=name;document.getElementById('player').textContent='📂 Attributes';document.getElementById('psub').innerHTML='<table class="attr-table">'+Object.entries(props||{}).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(typeof v==='object'?JSON.stringify(v):v)}</td></tr>`).join('')+'</table>';document.getElementById('parea').textContent='';document.getElementById('pcoord').textContent=`N ${latlng.lat.toFixed(6)}°  E ${latlng.lng.toFixed(6)}°`;document.getElementById('popup').style.display='block'}
function closePopup(){document.getElementById('popup').style.display='none'}
function makeLeaflet(meta,gj){return L.geoJSON(gj,{style:{color:'#ffffffaa',weight:1,fillColor:meta.color||'#3b82f6',fillOpacity:.45},onEachFeature:(f,l)=>{l.on('click',e=>{popupProps(meta.name,f.properties,e.latlng);L.DomEvent.stopPropagation(e)});l.on('mouseover',()=>l.setStyle({fillOpacity:.7,weight:2}));l.on('mouseout',()=>l.setStyle({fillOpacity:.45,weight:1}))}})}
function addLayer(meta,gj){const id=String(meta.id);if(AL[id]?.leaflet)map.removeLayer(AL[id].leaflet);const leaflet=makeLeaflet(meta,gj).addTo(map);AL[id]={...meta,leaflet};DATA[id]=gj;VM[id]=true}
function renderList(){const box=document.getElementById('layer-list');box.innerHTML='';Object.values(AL).forEach(meta=>{const id=String(meta.id),d=document.createElement('div');d.className='layer-item';d.dataset.key=id;d.innerHTML=`<div class="cdot" style="background:${esc(meta.color)}"></div><span class="lname">${esc(meta.name)}<br><small style="color:#475569">${meta.feature_count??DATA[id]?.features?.length??0} polygon</small></span><div class="layer-actions"><input class="layer-color" type="color" value="${esc(meta.color||'#3b82f6')}" title="เปลี่ยนสี"><button class="eye-btn">👁</button><button class="del-btn">🗑</button></div>`;d.querySelector('.eye-btn').onclick=()=>toggleLayer(id,d);d.querySelector('.del-btn').onclick=()=>deleteLayer(id);d.querySelector('.layer-color').onchange=e=>changeColor(id,e.target.value);box.appendChild(d)});document.getElementById('badge').textContent=`${Object.values(DATA).reduce((n,g)=>n+(g.features?.length||0),0)} Polygons · ${Object.keys(AL).length} Layers`}
function toggleLayer(id,d){const b=d.querySelector('.eye-btn');if(VM[id]){map.removeLayer(AL[id].leaflet);VM[id]=false;d.classList.add('hidden');b.textContent='🙈'}else{AL[id].leaflet.addTo(map);VM[id]=true;d.classList.remove('hidden');b.textContent='👁'}}
async function changeColor(id,color){const meta=AL[id];meta.color=color;meta.leaflet.setStyle({fillColor:color});try{await api(`/api/layers/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({color})});cacheNow()}catch(e){toast('เปลี่ยนสีบนเซิร์ฟเวอร์ไม่สำเร็จ: '+e.message,false)}renderList()}
async function deleteLayer(id){if(!confirm('ลบ Layer นี้หรือไม่?'))return;try{await api(`/api/layers/${id}`,{method:'DELETE'});map.removeLayer(AL[id].leaflet);delete AL[id];delete DATA[id];delete VM[id];cacheNow();renderList();toast('ลบ Layer แล้ว')}catch(e){toast('ลบไม่สำเร็จ: '+e.message,false)}}
async function api(path,opt={}){const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),12000);try{const r=await fetch(API_URL+path,{...opt,signal:ctl.signal});if(!r.ok)throw new Error((await r.text()).slice(0,300)||`HTTP ${r.status}`);return await r.json()}finally{clearTimeout(t)}}
function cacheNow(){const arr=Object.values(AL).map(m=>({meta:{id:m.id,name:m.name,color:m.color,feature_count:DATA[String(m.id)]?.features?.length||0},geojson:DATA[String(m.id)]}));try{localStorage.setItem(CACHE_KEY,JSON.stringify(arr))}catch(e){console.warn('cache full',e)}}
async function loadLayers(){const st=document.getElementById('layer-status');st.textContent='⏳ กำลังโหลด Layers จาก API...';try{const metas=await api('/api/layers');for(const m of metas){const full=await api(`/api/layers/${m.id}`);addLayer(m,full.geojson)}cacheNow();st.textContent='🟢 เชื่อมต่อ API แล้ว';renderList();fitAll()}catch(e){console.warn(e);const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'[]');if(cached.length){cached.forEach(x=>addLayer(x.meta,x.geojson));st.textContent='🟠 API ไม่ตอบสนอง — ใช้ข้อมูลจาก localStorage';renderList();fitAll();toast('ออฟไลน์: โหลด Layer จากเครื่องแทน',false)}else{st.textContent='🔴 API ไม่ตอบสนอง และยังไม่มี cache ในเครื่อง';toast('เชื่อมต่อ API ไม่ได้: '+e.message,false)}}}
function fitAll(){const g=L.featureGroup(Object.values(AL).map(x=>x.leaflet));try{if(g.getBounds().isValid())map.fitBounds(g.getBounds(),{padding:[20,20]})}catch(e){}}
async function uploadLayer(){const f=document.getElementById('layer-file').files[0];if(!f)return toast('กรุณาเลือกไฟล์ .zip หรือ GeoJSON',false);const fd=new FormData();fd.append('file',f);fd.append('name',document.getElementById('layer-name').value||f.name.replace(/\.[^.]+$/,''));fd.append('color',document.getElementById('layer-color').value);fd.append('source_crs',document.getElementById('source-crs').value);const b=document.getElementById('upload-btn');b.disabled=true;b.textContent='⏳ กำลังอัปโหลด...';try{const r=await api('/api/layers',{method:'POST',body:fd});const full=await api(`/api/layers/${r.id}`);addLayer({id:r.id,name:r.name,color:document.getElementById('layer-color').value,feature_count:r.feature_count},full.geojson);cacheNow();renderList();document.getElementById('upload-box').classList.remove('open');toast(`อัปโหลดสำเร็จ ${r.feature_count} features`)}catch(e){toast('อัปโหลดไม่สำเร็จ: '+e.message,false)}finally{b.disabled=false;b.textContent='⬆️ อัปโหลด Layer'}}
const CB=document.getElementById('cbar');map.on('mousemove',e=>CB.textContent=`📍 N ${e.latlng.lat.toFixed(6)}°  E ${e.latlng.lng.toFixed(6)}°`);map.on('click',e=>{CB.textContent=`📍 คลิก: N ${e.latlng.lat.toFixed(6)}°  E ${e.latlng.lng.toFixed(6)}°`;closePopup()});
function pip(lat,lng,coords){function ray(pt,ring){let inside=false;for(let a=0,b=ring.length-1;a<ring.length;b=a++){if(((ring[a][1]>pt[1])!==(ring[b][1]>pt[1]))&&(pt[0]<(ring[b][0]-ring[a][0])*(pt[1]-ring[a][1])/(ring[b][1]-ring[a][1])+ring[a][0]))inside=!inside}return inside}return ray([lng,lat],coords[0])}
function findAt(lat,lng){const out=[];for(const [id,gj] of Object.entries(DATA)){for(const f of gj.features||[]){const g=f.geometry;if(!g)continue;const hit=g.type==='Polygon'?pip(lat,lng,g.coordinates):g.type==='MultiPolygon'?g.coordinates.some(p=>pip(lat,lng,p)):false;if(hit)out.push({layer:AL[id].name,props:f.properties})}}return out}
let sMark=null;function searchCoord(){const lat=parseFloat(document.getElementById('ilat').value),lng=parseFloat(document.getElementById('ilon').value),res=document.getElementById('cres');if(isNaN(lat)||isNaN(lng)){res.className='notfound';res.textContent='⚠️ กรุณากรอกพิกัดให้ถูกต้อง';return}if(lat<5||lat>21||lng<97||lng>106){res.className='notfound';res.textContent='⚠️ พิกัดอยู่นอกประเทศไทย';return}if(sMark)map.removeLayer(sMark);sMark=L.marker([lat,lng]).addTo(map);map.setView([lat,lng],13);const found=findAt(lat,lng);if(found.length){res.className='found';res.innerHTML='✅ อยู่ใน:<br><b>'+[...new Set(found.map(x=>esc(x.layer)))].join('<br>')+'</b>';popupProps(found[0].layer,found[0].props,L.latLng(lat,lng))}else{res.className='notfound';res.textContent='❌ ไม่อยู่ในเขตพื้นที่ใด'}}
document.getElementById('ilat').addEventListener('keydown',e=>{if(e.key==='Enter')searchCoord()});document.getElementById('ilon').addEventListener('keydown',e=>{if(e.key==='Enter')searchCoord()});
let lMark=null,lCirc=null;function locateMe(){const btn=document.getElementById('loc-btn');if(!navigator.geolocation)return alert('Browser ไม่รองรับ Geolocation');btn.textContent='⏳ กำลังหาตำแหน่ง...';navigator.geolocation.getCurrentPosition(pos=>{const{latitude:lat,longitude:lng,accuracy:acc}=pos.coords;if(lMark)map.removeLayer(lMark);if(lCirc)map.removeLayer(lCirc);lCirc=L.circle([lat,lng],{radius:acc,color:'#3b82f6',fillOpacity:.1}).addTo(map);lMark=L.marker([lat,lng]).addTo(map);map.setView([lat,lng],13);document.getElementById('ilat').value=lat.toFixed(6);document.getElementById('ilon').value=lng.toFixed(6);const found=findAt(lat,lng),res=document.getElementById('cres');res.className=found.length?'found':'notfound';res.innerHTML=found.length?'📡 ตำแหน่งปัจจุบัน:<br><b>'+[...new Set(found.map(x=>esc(x.layer)))].join('<br>')+'</b>':'📡 ตำแหน่งปัจจุบัน: ไม่อยู่ในเขตพื้นที่';btn.textContent='✅ พบตำแหน่งแล้ว';setTimeout(()=>btn.textContent='📡 แสดงตำแหน่งของฉัน',3000)},err=>{btn.textContent='📡 แสดงตำแหน่งของฉัน';alert('ไม่สามารถเข้าถึงตำแหน่ง: '+err.message)},{enableHighAccuracy:true,timeout:10000})}
loadLayers();
</script>\n</body>\n</html>
